# Set max width images
[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "size"
show_hidden = true
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]

[preview]
tab_size = 2
max_width = 1500
max_height = 2000
cache_dir = ""
image_delay = 30
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15

[opener]
pdf = [
  { run = 'sioyek %s 1>/dev/null 2>/dev/null & disown', block = false, for = "unix" },
  { run = 'zathura %s 1>/dev/null 2>/dev/null & disown', block = false, for = "unix" },
]

[open]
# Yazi uses only the FIRST matching rule, so append_rules can't add an opener
# to every file. Instead, override the v26.9.1 defaults with "open" (macOS
# `open` / xdg-open, i.e. the system default app) added to each one.
# The first entry of each rule (what `o` runs) is unchanged.
rules = [
  { mime = "folder/*", use = ["edit", "open", "reveal"] },
  { mime = "text/*", use = ["edit", "open", "reveal"] },
  { mime = "image/*", use = ["open", "reveal"] },
  { mime = "{audio,video}/*", use = ["play", "open", "reveal"] },
  { mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = ["edit", "open", "reveal"] },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = ["extract", "open", "reveal"] },
  { mime = "inode/empty", use = ["edit", "open", "reveal"] },
  { mime = "vfs/{absent,stale}", use = "download" },
  { mime = "trash/**", use = ["open", "trash"] },
  { url = "*", use = ["open", "reveal"] },
]
prepend_rules = [
  { url = "*.pdf", use = ["pdf", "open", "reveal"] },
  # SolidCraft designs are zip containers; without this they match the archive rule
  { url = "*.sc", use = ["open", "reveal", "extract"] },
]

[[plugin.prepend_fetchers]]
id = "git"
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
id = "git"
url = "*/"
run = "git"
group = "git"

[[plugin.prepend_previewers]]
url = "*.csv"
run = 'piper -- bat -p --color=always "$1"'
group = "bat"

[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'
group = "glow"

[[plugin.prepend_previewers]]
url = "*/"
run = "eza-preview"
group = "eza"
